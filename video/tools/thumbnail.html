<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Thumbnail</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1280px; height: 720px; overflow: hidden; }
  body {
    font-family: Inter, system-ui, sans-serif; color: #fff; -webkit-font-smoothing: antialiased;
    background:
      radial-gradient(700px 500px at 80% 40%, rgba(34,197,94,.35), transparent 70%),
      radial-gradient(600px 400px at 0% 100%, rgba(56,189,248,.18), transparent 70%),
      #050806;
  }
  .txt { position: absolute; left: 60px; top: 70px; width: 760px; }
  .zero { font-size: 210px; font-weight: 900; line-height: .9; letter-spacing: -0.05em; color: #22c55e; text-shadow: 0 8px 0 #0a3d1c, 0 20px 60px rgba(0,0,0,.6); }
  .code { font-size: 150px; font-weight: 900; line-height: .9; letter-spacing: -0.045em; text-shadow: 0 8px 0 #222, 0 20px 60px rgba(0,0,0,.6); }
  .sub {
    display: inline-block; margin-top: 34px; background: #facc15; color: #111; font-size: 56px; font-weight: 900;
    padding: 10px 26px; border-radius: 16px; transform: rotate(-2deg); letter-spacing: -0.02em;
  }
  .phone {
    position: absolute; right: 70px; top: 40px; width: 330px; height: 670px; border-radius: 48px;
    background: #000; padding: 12px; transform: rotate(6deg);
    box-shadow: 0 0 0 2px #2b3530, 0 0 0 8px #0d1110, 0 30px 90px rgba(0,0,0,.7), 0 0 140px rgba(34,197,94,.45);
  }
  .phone .screen { width: 306px; height: 646px; border-radius: 38px; overflow: hidden; background: #0b0f0d; }
  iframe { width: 390px; height: 823px; border: 0; transform: scale(.7846); transform-origin: 0 0; }
  .tag {
    position: absolute; right: 300px; top: 560px; background: #ef4444; font-size: 40px; font-weight: 900;
    padding: 10px 22px; border-radius: 14px; transform: rotate(-4deg); box-shadow: 0 10px 30px rgba(0,0,0,.5);
  }
</style>
</head>
<body>
  <div class="txt">
    <div class="zero">0</div>
    <div class="code">CODE.</div>
    <div class="sub">AI BUILT MY APP</div>
  </div>
  <div class="phone"><div class="screen"><iframe id="f"></iframe></div></div>
  <div class="tag">REAL APP ✓</div>
<script>
  const d = n => { const x = new Date(); x.setDate(Math.max(1, x.getDate() - n)); return x.toISOString().slice(0, 10); };
  try {
    localStorage.setItem('hustle-tracker-v1', JSON.stringify([
      { id: 1, amount: 3500, date: d(9), source: 'Freelancing', note: 'Website copy' },
      { id: 2, amount: 1450, date: d(7), source: 'YouTube', note: 'Ad revenue' },
      { id: 3, amount: 900, date: d(5), source: 'Etsy', note: 'Planner template' },
      { id: 4, amount: 2200, date: d(3), source: 'Freelancing', note: 'Logo design' },
      { id: 5, amount: 600, date: d(2), source: 'Other', note: 'Prompt pack' },
    ]));
  } catch (e) {}
  const f = document.getElementById('f');
  window.ready = new Promise(r => f.addEventListener('load', () => setTimeout(r, 600), { once: true }));
  f.src = '/repo/apps/hustle-tracker/index.html';
</script>
</body>
</html>
